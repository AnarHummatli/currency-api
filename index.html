<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>

        <div class="part-of-header">
            <img id="logo" src="Images/logo.svg" alt="Logo">
            <nav>
                <ul class="menyu">
                    <li>BANK</li>
                    <li>BİZNES</li>
                    <li>FƏRDİ</li>
                    <li>KART</li>
                    <li>ONLINE</li>
                    <li>MÜRACİƏT</li>
                    <li>HAQQIMIZDA</li>
                </ul>
            </nav>
        </div>
        <h3>LOGİN</h3>

    </header>
    <main>

        <h1>Valyuta dəyişdir</h1>

        <div class="first-change change">
            <h5>Daxil et/Dəyiş</h5>
            <div class="currencies">
                <button class="active">RUB</button>
                <button>USD</button>
                <button>EUR</button>
                <button>GBP</button>
            </div>
        </div>

        <div class="second-change change">
            <h5>Daxil et/Dəyiş</h5>
            <div class="currencies">
                <button>RUB</button>
                <button class="active">USD</button>
                <button>EUR</button>
                <button>GBP</button>
            </div>
        </div>

        <div class="third-change change">
            <h5>Hansı bank?</h5>
            <div class="currencies">
                <button>ABC</button>
                <button class="active">NEW</button>
                <button>AME</button>
                <button>RED</button>
            </div>
        </div>

        <input type="text" class="first-input input" value="5000">
        <p class="first-exchange-info exchange-info"></p>

        <input type="text" class="second-input input">
        <p class="second-exchange-info exchange-info"></p>

        <div class="buy-box box">
            <p class="process">BUY</p>
            <p class="buy-text answer"></p>
        </div>

        <div class="sell-box box">
            <p class="process">SELL</p>
            <p class="sell-text answer"></p>
        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
